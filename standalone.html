<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Enterprise Flour Mill Management System - Standalone Single File</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#fffbeb',
              100: '#fef3c7',
              500: '#f59e0b',
              600: '#d97706',
              700: '#b45309',
            }
          }
        }
      }
    }
  </script>
  <!-- React & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #090d16;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #334155;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased selection:bg-amber-500/30 selection:text-amber-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- INITIAL DATA (Matching Enterprise Standards) ---
    const INITIAL_EMPLOYEES = [
      { id: "EMP01", name: "Ahmed Khan", role: "Mill Operator", shift: "Morning", salary: 45000, contact: "+92 300 4581290" },
      { id: "EMP02", name: "Muhammad Ali", role: "Inventory Manager", shift: "Night", salary: 55000, contact: "+92 321 8847291" },
      { id: "EMP03", name: "Tariq Mehmood", role: "Quality Control", shift: "Morning", salary: 62000, contact: "+92 333 9123847" },
      { id: "EMP04", name: "Rashid Javed", role: "Head Miller", shift: "Evening", salary: 75000, contact: "+92 301 5567812" },
      { id: "EMP05", name: "Bilal Hassan", role: "Accountant", shift: "Morning", salary: 58000, contact: "+92 345 6789123" },
      { id: "EMP06", name: "Zeeshan Akhtar", role: "Laborer", shift: "Night", salary: 38000, contact: "+92 312 3456789" },
    ];

    const INITIAL_MATERIALS = [
      { batchId: "B01", item: "Hard Wheat (Punjab Premium)", category: "Raw Wheat", stockTons: 120, moisturePercent: 12.5, glutenPercent: 28.0, proteinPercent: 13.2, ashPercent: 1.45, siloLocation: "Silo A (Steel)", maxCapacityTons: 200, status: "Optimal" },
      { batchId: "B02", item: "Soft Wheat (Sindh Harvest)", category: "Raw Wheat", stockTons: 85, moisturePercent: 14.1, glutenPercent: 24.5, proteinPercent: 10.9, ashPercent: 1.58, siloLocation: "Silo B (Concrete)", maxCapacityTons: 150, status: "Caution" },
      { batchId: "B03", item: "Superfine Maida (Patent Flour)", category: "Finished Flour", stockTons: 45, moisturePercent: 13.6, glutenPercent: 29.5, proteinPercent: 12.4, ashPercent: 0.52, siloLocation: "Finished Bay 1", maxCapacityTons: 80, status: "Optimal" },
      { batchId: "B04", item: "Whole Wheat Chakki Atta", category: "Finished Flour", stockTons: 62, moisturePercent: 12.8, glutenPercent: 26.2, proteinPercent: 11.8, ashPercent: 1.62, siloLocation: "Finished Bay 2", maxCapacityTons: 100, status: "Optimal" },
      { batchId: "B05", item: "Coarse Wheat Bran (Choker)", category: "By-Product", stockTons: 32, moisturePercent: 11.2, glutenPercent: 0, proteinPercent: 14.5, ashPercent: 4.8, siloLocation: "By-Product Silo 1", maxCapacityTons: 60, status: "Optimal" },
    ];

    const INITIAL_CLIENTS = [
      { clientId: "C01", name: "Supreme Bakery", contact: "0300-1234567", city: "Lahore", creditLimit: 500000, outstandingBalance: 120000, securityDepositHeld: 200000 },
      { clientId: "C02", name: "Metro Traders", contact: "0312-7654321", city: "Rawalpindi", creditLimit: 1000000, outstandingBalance: 450000, securityDepositHeld: 300000 },
      { clientId: "C03", name: "Al-Madina Confectioners", contact: "0321-9876543", city: "Faisalabad", creditLimit: 750000, outstandingBalance: 710000, securityDepositHeld: 150000 },
      { clientId: "C04", name: "Golden Crust Breads", contact: "0345-4433221", city: "Gujranwala", creditLimit: 800000, outstandingBalance: 185000, securityDepositHeld: 250000 },
    ];

    const INITIAL_FINANCIALS = [
      { id: "FIN-D01", entity: "Supreme Bakery", type: "Deposit", amount: 200000, interestRate: 0, tenureMonths: 12, status: "Active", purpose: "Security Deposit against credit purchases" },
      { id: "FIN-D02", entity: "Metro Traders", type: "Deposit", amount: 300000, interestRate: 0, tenureMonths: 24, status: "Active", purpose: "Bulk Purchase Collateral Margin" },
      { id: "FIN-L01", entity: "National Bank", type: "Loan", amount: 1500000, interestRate: 11.5, tenureMonths: 36, status: "Active", purpose: "Seasonal Wheat Procurement Credit Facility" },
      { id: "FIN-L02", entity: "Habib Bank Limited", type: "Loan", amount: 2500000, interestRate: 12.2, tenureMonths: 48, status: "Active", purpose: "Roller Mill Automation & Silo Upgrade Loan" },
    ];

    // --- UTILITIES ---
    const formatPKR = (num) => "PKR " + (Number(num) || 0).toLocaleString("en-PK");
    const formatTons = (num) => (Number(num) || 0).toLocaleString() + " Tons";

    const exportToCSV = (data, filename) => {
      if (!data || !data.length) return;
      const headers = Object.keys(data[0]);
      const rows = data.map(row => headers.map(h => {
        const val = row[h];
        return typeof val === 'string' && val.includes(',') ? `"${val}"` : val ?? '';
      }).join(','));
      const blob = new Blob([[headers.join(','), ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.setAttribute("href", url);
      link.setAttribute("download", `${filename}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    // --- MAIN APP COMPONENT ---
    function App() {
      const [currentTab, setCurrentTab] = useState("Dashboard Overview");
      const [employees, setEmployees] = useState(() => {
        try {
          const s = localStorage.getItem("mill_standalone_employees");
          return s ? JSON.parse(s) : INITIAL_EMPLOYEES;
        } catch { return INITIAL_EMPLOYEES; }
      });
      const [materials, setMaterials] = useState(() => {
        try {
          const s = localStorage.getItem("mill_standalone_materials");
          return s ? JSON.parse(s) : INITIAL_MATERIALS;
        } catch { return INITIAL_MATERIALS; }
      });
      const [clients, setClients] = useState(() => {
        try {
          const s = localStorage.getItem("mill_standalone_clients");
          return s ? JSON.parse(s) : INITIAL_CLIENTS;
        } catch { return INITIAL_CLIENTS; }
      });
      const [financials, setFinancials] = useState(() => {
        try {
          const s = localStorage.getItem("mill_standalone_financials");
          return s ? JSON.parse(s) : INITIAL_FINANCIALS;
        } catch { return INITIAL_FINANCIALS; }
      });

      // Save to localStorage
      useEffect(() => {
        localStorage.setItem("mill_standalone_employees", JSON.stringify(employees));
      }, [employees]);
      useEffect(() => {
        localStorage.setItem("mill_standalone_materials", JSON.stringify(materials));
      }, [materials]);
      useEffect(() => {
        localStorage.setItem("mill_standalone_clients", JSON.stringify(clients));
      }, [clients]);
      useEffect(() => {
        localStorage.setItem("mill_standalone_financials", JSON.stringify(financials));
      }, [financials]);

      const resetData = () => {
        if (confirm("Reset mill records to original factory defaults?")) {
          setEmployees(INITIAL_EMPLOYEES);
          setMaterials(INITIAL_MATERIALS);
          setClients(INITIAL_CLIENTS);
          setFinancials(INITIAL_FINANCIALS);
        }
      };

      const exportBackup = () => {
        const payload = { timestamp: new Date().toISOString(), employees, materials, clients, financials };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `flour_mill_backup_${new Date().toISOString().split('T')[0]}.json`;
        a.click();
      };

      // Aggregates
      const totalRawWheatStock = useMemo(() => materials.filter(m => m.category === 'Raw Wheat').reduce((s, m) => s + m.stockTons, 0), [materials]);
      const totalClientOutstanding = useMemo(() => clients.reduce((s, c) => s + c.outstandingBalance, 0), [clients]);
      const totalCreditLimit = useMemo(() => clients.reduce((s, c) => s + c.creditLimit, 0), [clients]);
      const totalLoans = useMemo(() => financials.filter(f => f.type === 'Loan' && f.status === 'Active').reduce((s, f) => s + f.amount, 0), [financials]);
      const totalDeposits = useMemo(() => financials.filter(f => f.type === 'Deposit' && f.status === 'Active').reduce((s, f) => s + f.amount, 0), [financials]);
      const hasMoistureWarning = useMemo(() => materials.some(m => m.category === 'Raw Wheat' && m.moisturePercent > 13.5), [materials]);
      const hasCreditWarning = useMemo(() => clients.some(c => c.creditLimit > 0 && (c.outstandingBalance / c.creditLimit) >= 0.8), [clients]);

      // Navigation handler with preset prompt for AI
      const [aiInitialPrompt, setAiInitialPrompt] = useState("Analyze my raw material quality and financial risk based on the current records.");
      const navigateToAi = (prompt) => {
        if (prompt) setAiInitialPrompt(prompt);
        setCurrentTab("AI Studio Analytics");
      };

      return (
        <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
          {/* Header */}
          <header className="border-b border-slate-800 bg-slate-900/95 sticky top-0 z-30 backdrop-blur">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col sm:flex-row items-center justify-between gap-3">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-amber-500 to-amber-600 text-slate-950 flex items-center justify-center font-bold text-lg shadow-lg shadow-amber-500/20">
                  🏭
                </div>
                <div>
                  <div className="flex items-center gap-2">
                    <h1 className="text-base sm:text-lg font-bold text-white tracking-tight">Enterprise Flour Mill Management System</h1>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/10 text-amber-400 border border-amber-500/20">Standalone</span>
                  </div>
                  <p className="text-xs text-slate-400">
                    Industrial Operating Suite &middot; Active Staff: <span className="text-slate-200 font-semibold">{employees.length}</span> &middot; Raw Wheat: <span className="text-amber-300 font-semibold">{totalRawWheatStock} Tons</span>
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2.5">
                <div className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg border border-emerald-500/30 bg-emerald-950/40 text-emerald-300 text-xs font-medium">
                  <span className="h-2 w-2 rounded-full bg-emerald-400 animate-pulse"></span>
                  <span>AI Engine Ready</span>
                </div>
                <button onClick={exportBackup} className="px-3 py-1.5 text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700 transition">
                  Backup JSON
                </button>
                <button onClick={resetData} className="px-3 py-1.5 text-xs font-semibold bg-slate-800/60 hover:bg-slate-800 text-slate-400 hover:text-slate-200 rounded-lg border border-slate-700/60 transition">
                  Reset Data
                </button>
              </div>
            </div>
          </header>

          {/* Layout Body */}
          <div className="flex-1 flex flex-col lg:flex-row max-w-7xl w-full mx-auto">
            {/* Sidebar */}
            <aside className="w-full lg:w-64 bg-slate-900 border-r border-slate-800 p-4 shrink-0 flex flex-col justify-between">
              <div className="space-y-4">
                <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400 px-2">Navigation Modules</div>
                <nav className="space-y-1">
                  {[
                    { id: "Dashboard Overview", label: "Dashboard Overview", icon: "🏢" },
                    { id: "Employee Details", label: "Employee Details", icon: "👨💼", count: employees.length },
                    { id: "Material & Inventory", label: "Material & Inventory", icon: "🌾", count: `${materials.length} B`, alert: hasMoistureWarning },
                    { id: "Client Management", label: "Client Management", icon: "🤝", count: clients.length, alert: hasCreditWarning },
                    { id: "Loans & Deposits", label: "Loans & Deposits", icon: "💳", count: financials.length },
                    { id: "Milling & Blend Lab", label: "Milling & Blend Lab", icon: "🔬", tag: "Sim" },
                    { id: "AI Studio Analytics", label: "AI Studio Analytics", icon: "🤖", tag: "AI 3.8" },
                  ].map((item) => {
                    const active = currentTab === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setCurrentTab(item.id)}
                        className={`w-full flex items-center justify-between px-3 py-2.5 rounded-xl text-xs sm:text-sm font-medium transition ${
                          active
                            ? 'bg-amber-500 text-slate-950 font-bold shadow-md shadow-amber-500/20'
                            : 'text-slate-300 hover:text-white hover:bg-slate-800/80'
                        }`}
                      >
                        <div className="flex items-center gap-2.5 truncate">
                          <span>{item.icon}</span>
                          <span className="truncate">{item.label}</span>
                        </div>
                        <div className="flex items-center gap-1.5">
                          {item.alert && <span className="text-amber-400 text-xs">⚠️</span>}
                          {item.count !== undefined && (
                            <span className={`text-[11px] font-mono px-2 py-0.5 rounded-full ${active ? 'bg-slate-900/30 text-slate-950' : 'bg-slate-800 text-slate-400'}`}>
                              {item.count}
                            </span>
                          )}
                          {item.tag && (
                            <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${active ? 'bg-slate-950 text-amber-300' : 'bg-amber-500/10 text-amber-400 border border-amber-500/20'}`}>
                              {item.tag}
                            </span>
                          )}
                        </div>
                      </button>
                    );
                  })}
                </nav>
              </div>

              {/* Sidebar Quick Footer */}
              <div className="mt-6 pt-4 border-t border-slate-800 text-[11px] text-slate-500">
                <div className="flex justify-between text-slate-400 mb-1">
                  <span>Factory ID:</span>
                  <span className="font-mono text-slate-200">MILL-PK-04</span>
                </div>
                <p className="text-[10px] text-slate-500 leading-tight">Automated Flour ERP with tempering simulation & credit risk monitoring.</p>
              </div>
            </aside>

            {/* Main Content View */}
            <main className="flex-1 p-4 sm:p-6 lg:p-8 overflow-y-auto">
              {currentTab === "Dashboard Overview" && (
                <DashboardView
                  employees={employees}
                  materials={materials}
                  clients={clients}
                  financials={financials}
                  onNavigateToAi={navigateToAi}
                  onNavigateToTab={setCurrentTab}
                  totalRawWheatStock={totalRawWheatStock}
                  totalClientOutstanding={totalClientOutstanding}
                  totalCreditLimit={totalCreditLimit}
                  totalLoans={totalLoans}
                  totalDeposits={totalDeposits}
                  hasMoistureWarning={hasMoistureWarning}
                />
              )}

              {currentTab === "Employee Details" && (
                <EmployeesView
                  employees={employees}
                  setEmployees={setEmployees}
                />
              )}

              {currentTab === "Material & Inventory" && (
                <MaterialsView
                  materials={materials}
                  setMaterials={setMaterials}
                  onNavigateToBlend={() => setCurrentTab("Milling & Blend Lab")}
                />
              )}

              {currentTab === "Client Management" && (
                <ClientsView
                  clients={clients}
                  setClients={setClients}
                />
              )}

              {currentTab === "Loans & Deposits" && (
                <FinancialsView
                  financials={financials}
                  setFinancials={setFinancials}
                />
              )}

              {currentTab === "Milling & Blend Lab" && (
                <BlendLabView
                  materials={materials}
                  onConsultAi={navigateToAi}
                />
              )}

              {currentTab === "AI Studio Analytics" && (
                <AiAnalyticsView
                  materials={materials}
                  clients={clients}
                  financials={financials}
                  employees={employees}
                  initialPrompt={aiInitialPrompt}
                />
              )}
            </main>
          </div>
        </div>
      );
    }

    // ==========================================
    // 1. DASHBOARD OVERVIEW VIEW
    // ==========================================
    function DashboardView({
      employees, materials, clients, financials, onNavigateToAi, onNavigateToTab,
      totalRawWheatStock, totalClientOutstanding, totalCreditLimit, totalLoans, totalDeposits, hasMoistureWarning
    }) {
      const highMoistureBatches = materials.filter(m => m.category === 'Raw Wheat' && m.moisturePercent > 13.5);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3 pb-3 border-b border-slate-800">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
                <span>🏢</span> Flour Mill Executive Dashboard
              </h2>
              <p className="text-xs sm:text-sm text-slate-400 mt-0.5">Real-time Overview of Mill Operations, Silos & Credit Risk</p>
            </div>
            <button
              onClick={() => onNavigateToAi("Analyze my raw material quality and financial risk based on the current records.")}
              className="px-4 py-2 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-amber-500/20 transition flex items-center gap-2 self-start sm:self-auto"
            >
              <span>✨</span>
              <span>Generate AI Mill Advisory</span>
            </button>
          </div>

          {/* 4 Core Metrics */}
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div onClick={() => onNavigateToTab("Employee Details")} className="cursor-pointer bg-slate-900 border border-slate-800 hover:border-slate-700 p-4 rounded-2xl transition">
              <div className="flex justify-between items-center text-xs font-semibold uppercase text-slate-400">
                <span>Total Active Staff</span>
                <span>👨💼</span>
              </div>
              <div className="mt-2 text-3xl font-extrabold text-white font-mono">{employees.length}</div>
              <div className="mt-1 text-[11px] text-slate-500">Across 3 Operating Shifts</div>
            </div>

            <div onClick={() => onNavigateToTab("Material & Inventory")} className="cursor-pointer bg-slate-900 border border-slate-800 hover:border-slate-700 p-4 rounded-2xl transition">
              <div className="flex justify-between items-center text-xs font-semibold uppercase text-slate-400">
                <span>Total Wheat Stock</span>
                <span>🌾</span>
              </div>
              <div className="mt-2 text-3xl font-extrabold text-amber-400 font-mono">{totalRawWheatStock} Tons</div>
              <div className="mt-1 text-[11px] text-slate-500">Raw Grain in Storage Silos</div>
            </div>

            <div onClick={() => onNavigateToTab("Client Management")} className="cursor-pointer bg-slate-900 border border-slate-800 hover:border-slate-700 p-4 rounded-2xl transition">
              <div className="flex justify-between items-center text-xs font-semibold uppercase text-slate-400">
                <span>Client Outstanding</span>
                <span>🤝</span>
              </div>
              <div className="mt-2 text-xl font-extrabold text-white font-mono">{formatPKR(totalClientOutstanding)}</div>
              <div className="mt-1 text-[11px] text-slate-500">Limit: {formatPKR(totalCreditLimit)}</div>
            </div>

            <div onClick={() => onNavigateToTab("Loans & Deposits")} className="cursor-pointer bg-slate-900 border border-slate-800 hover:border-slate-700 p-4 rounded-2xl transition">
              <div className="flex justify-between items-center text-xs font-semibold uppercase text-slate-400">
                <span>Active Loans / Deposits</span>
                <span>💳</span>
              </div>
              <div className="mt-2 text-3xl font-extrabold text-purple-400 font-mono">{financials.filter(f=>f.status==='Active').length}</div>
              <div className="mt-1 text-[11px] text-slate-500">Bank Debt: {formatPKR(totalLoans)}</div>
            </div>
          </div>

          {/* Moisture Warning Banner */}
          {hasMoistureWarning && (
            <div className="p-4 rounded-xl border border-amber-500/30 bg-amber-950/20 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 text-amber-200 text-xs">
              <div className="flex items-start gap-2.5">
                <span className="text-xl">⚠️</span>
                <div>
                  <p className="font-bold text-amber-300">Moisture Conditioning Alert: Batch {highMoistureBatches.map(b => b.batchId).join(', ')} exceed 13.5%</p>
                  <p className="text-[11px] text-amber-300/80 mt-0.5">High risk of roll gumming or mold spoilage. Aerate silo or dry-blend with Hard Wheat ({materials.find(m=>m.batchId==='B01')?.moisturePercent}%).</p>
                </div>
              </div>
              <button
                onClick={() => onNavigateToAi("How should I handle high moisture in Batch B02 (14.1%) when milling with Hard Wheat Batch B01 (12.5%)?")}
                className="px-3 py-1.5 rounded-lg bg-amber-500/30 hover:bg-amber-500/40 text-amber-200 border border-amber-500/40 font-semibold shrink-0"
              >
                Consult Milling AI &rarr;
              </button>
            </div>
          )}

          {/* Silos Visualizer & Working Capital Health */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
              <div className="flex justify-between items-center">
                <h3 className="font-bold text-white text-sm flex items-center gap-2">
                  <span>🌾</span> Grain Silo & Storage Capacity
                </h3>
                <button onClick={() => onNavigateToTab("Material & Inventory")} className="text-xs text-amber-400 hover:underline">
                  All Batches &rarr;
                </button>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                {materials.slice(0, 4).map(mat => {
                  const maxCap = mat.maxCapacityTons || 150;
                  const fillPct = Math.min(100, Math.round((mat.stockTons / maxCap) * 100));
                  return (
                    <div key={mat.batchId} className="bg-slate-950 p-3.5 rounded-xl border border-slate-800/80 space-y-2">
                      <div className="flex justify-between items-center text-xs">
                        <span className="font-bold font-mono text-amber-400">{mat.batchId}: <span className="font-sans text-white">{mat.item}</span></span>

    // ==========================================
    // 4. CLIENT MANAGEMENT VIEW
    // ==========================================
    function ClientsView({ clients, setClients }) {
      const [search, setSearch] = useState("");
      const [isModalOpen, setIsModalOpen] = useState(false);
      const [editingClient, setEditingClient] = useState(null);
      const [txClient, setTxClient] = useState(null);

      // Add/Edit states
      const [formId, setFormId] = useState("");
      const [formName, setFormName] = useState("");
      const [formContact, setFormContact] = useState("0300-");
      const [formCity, setFormCity] = useState("Lahore");
      const [formCreditLimit, setFormCreditLimit] = useState(500000);
      const [formBalance, setFormBalance] = useState(100000);
      const [formDeposit, setFormDeposit] = useState(200000);

      // Tx state
      const [txType, setTxType] = useState("Payment");
      const [txAmount, setTxAmount] = useState(50000);

      const filtered = clients.filter(c => c.name.toLowerCase().includes(search.toLowerCase()) || c.clientId.toLowerCase().includes(search.toLowerCase()));

      const openAdd = () => {
        setEditingClient(null);
        setFormId(`C0${clients.length + 1}`);
        setFormName("");
        setFormContact("0300-");
        setFormCity("Lahore");
        setFormCreditLimit(500000);
        setFormBalance(0);
        setFormDeposit(100000);
        setIsModalOpen(true);
      };

      const openEdit = (c) => {
        setEditingClient(c);
        setFormId(c.clientId);
        setFormName(c.name);
        setFormContact(c.contact);
        setFormCity(c.city || 'Lahore');
        setFormCreditLimit(c.creditLimit);
        setFormBalance(c.outstandingBalance);
        setFormDeposit(c.securityDepositHeld || 0);
        setIsModalOpen(true);
      };

      const saveClient = (e) => {
        e.preventDefault();
        if (!formName.trim()) return alert("Client name required");

        if (editingClient) {
          setClients(prev => prev.map(c => c.clientId === editingClient.clientId ? { ...c, name: formName, contact: formContact, city: formCity, creditLimit: Number(formCreditLimit), outstandingBalance: Number(formBalance), securityDepositHeld: Number(formDeposit) } : c));
        } else {
          setClients(prev => [{ clientId: formId.toUpperCase(), name: formName, contact: formContact, city: formCity, creditLimit: Number(formCreditLimit), outstandingBalance: Number(formBalance), securityDepositHeld: Number(formDeposit) }, ...prev]);
        }
        setIsModalOpen(false);
      };

      const handleTx = (e) => {
        e.preventDefault();
        if (!txClient) return;
        let newBal = txClient.outstandingBalance;
        if (txType === 'Payment') {
          newBal = Math.max(0, newBal - Number(txAmount));
        } else {
          newBal += Number(txAmount);
        }
        setClients(prev => prev.map(c => c.clientId === txClient.clientId ? { ...c, outstandingBalance: newBal } : c));
        setTxClient(null);
      };

      const deleteClient = (id) => {
        if (confirm(`Delete client ${id}?`)) {
          setClients(prev => prev.filter(c => c.clientId !== id));
        }
      };

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-3 border-b border-slate-800">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
                <span>🤝</span> Client & Ledger Accounts
              </h2>
              <p className="text-xs sm:text-sm text-slate-400">Commercial buyer ledgers, credit risk control, and settlements</p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => exportToCSV(clients, 'mill_clients')} className="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700">Export CSV</button>
              <button onClick={openAdd} className="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-amber-500/20">+ Add Client</button>
            </div>
          </div>

          <div className="p-3 bg-slate-900 border border-slate-800 rounded-2xl">
            <input
              type="text"
              placeholder="Search by client bakery, trader, or ID..."
              value={search}
              onChange={e => setSearch(e.target.value)}
              className="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-xl text-xs text-white placeholder-slate-500"
            />
          </div>

          <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-left text-xs">
                <thead className="bg-slate-950 text-slate-400 uppercase font-semibold">
                  <tr>
                    <th className="p-3">Client ID</th>
                    <th className="p-3">Client Name</th>
                    <th className="p-3">Contact</th>
                    <th className="p-3 text-right">Credit Limit</th>
                    <th className="p-3 text-right">Outstanding Balance</th>
                    <th className="p-3 text-right">Deposit Held</th>
                    <th className="p-3">Utilization</th>
                    <th className="p-3 text-right">Actions</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/60 font-mono">
                  {filtered.map(c => {
                    const util = c.creditLimit > 0 ? Math.round((c.outstandingBalance / c.creditLimit) * 100) : 0;
                    return (
                      <tr key={c.clientId} className="hover:bg-slate-800/40">
                        <td className="p-3 font-bold text-amber-400">{c.clientId}</td>
                        <td className="p-3 font-sans font-bold text-white">{c.name}</td>
                        <td className="p-3 font-sans text-slate-400">{c.contact} ({c.city})</td>
                        <td className="p-3 text-right text-slate-300">{formatPKR(c.creditLimit)}</td>
                        <td className="p-3 text-right font-bold text-white">{formatPKR(c.outstandingBalance)}</td>
                        <td className="p-3 text-right text-emerald-400">{formatPKR(c.securityDepositHeld || 0)}</td>
                        <td className="p-3 min-w-[120px]">
                          <div className="space-y-1">
                            <span className="text-[10px] text-slate-400 font-sans">{util}% used</span>
                            <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden">
                              <div className={`h-full ${util>=80?'bg-red-500':util>=50?'bg-amber-500':'bg-emerald-500'}`} style={{ width: `${Math.min(100, util)}%` }}></div>
                            </div>
                          </div>
                        </td>
                        <td className="p-3 text-right font-sans">
                          <button onClick={() => { setTxClient(c); setTxType('Payment'); setTxAmount(50000); }} className="px-2 py-1 bg-emerald-500/20 text-emerald-300 font-semibold rounded mr-1">Ledger</button>
                          <button onClick={() => openEdit(c)} className="px-2 py-1 bg-slate-800 text-slate-300 rounded mr-1">Edit</button>
                          <button onClick={() => deleteClient(c.clientId)} className="px-2 py-1 bg-red-500/10 text-red-400 rounded">Delete</button>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>

          {/* Ledger Tx Modal */}
          {txClient && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
              <div className="w-full max-w-sm bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="font-bold text-white text-sm">Post Ledger Transaction: {txClient.name}</h3>
                  <button onClick={() => setTxClient(null)} className="text-slate-400 hover:text-white">&times;</button>
                </div>
                <div className="p-3 bg-slate-950 rounded-xl text-xs flex justify-between font-mono">
                  <span className="text-slate-400">Current Balance:</span>
                  <span className="text-amber-400 font-bold">{formatPKR(txClient.outstandingBalance)}</span>
                </div>
                <form onSubmit={handleTx} className="space-y-3 text-xs">
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setTxType('Payment')} className={`flex-1 py-1.5 rounded-lg font-bold ${txType==='Payment'?'bg-emerald-500 text-slate-950':'bg-slate-800 text-slate-300'}`}>Payment Received</button>
                    <button type="button" onClick={() => setTxType('Invoice')} className={`flex-1 py-1.5 rounded-lg font-bold ${txType==='Invoice'?'bg-amber-500 text-slate-950':'bg-slate-800 text-slate-300'}`}>Invoice Billed</button>
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Amount (PKR)</label>
                    <input type="number" min="1" step="1000" value={txAmount} onChange={e=>setTxAmount(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white font-mono" required />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onClick={() => setTxClient(null)} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 bg-amber-500 text-slate-950 font-bold rounded-lg">Post</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Add/Edit Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-sm">
              <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
                <div className="flex justify-between items-center pb-2 border-b border-slate-800">
                  <h3 className="font-bold text-white text-sm">{editingClient ? 'Edit Client' : 'Register New Client'}</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white">&times;</button>
                </div>
                <form onSubmit={saveClient} className="space-y-3 text-xs">
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 block mb-1">Client ID</label>
                      <input disabled={Boolean(editingClient)} type="text" value={formId} onChange={e=>setFormId(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white font-mono" required />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">City</label>
                      <input type="text" value={formCity} onChange={e=>setFormCity(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white" required />
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Business Name</label>
                    <input type="text" value={formName} onChange={e=>setFormName(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white" required />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Contact Phone</label>
                    <input type="text" value={formContact} onChange={e=>setFormContact(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white" required />
                  </div>
                  <div className="grid grid-cols-3 gap-2">
                    <div>
                      <label className="text-slate-400 block mb-1">Credit Limit</label>
                      <input type="number" step="10000" value={formCreditLimit} onChange={e=>setFormCreditLimit(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white font-mono" required />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Balance</label>
                      <input type="number" step="10000" value={formBalance} onChange={e=>setFormBalance(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white font-mono" required />
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Deposit</label>
                      <input type="number" step="10000" value={formDeposit} onChange={e=>setFormDeposit(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white font-mono" />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 bg-amber-500 text-slate-950 font-bold rounded-lg">{editingClient ? 'Update' : 'Save'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    function FinancialsView({ financials, setFinancials }) {
      const [filter, setFilter] = useState("All");

      const [editingFin, setEditingFin] = useState(null);

      const [formRate, setFormRate] = useState(11.5);
      const [formPurpose, setFormPurpose] = useState("Working Capital");

      const filtered = financials.filter(f => filter === "All" || f.type === filter);
      const totalLoans = financials.filter(f => f.type === 'Loan' && f.status === 'Active').reduce((s, f) => s + f.amount, 0);
      const totalDeposits = financials.filter(f => f.type === 'Deposit' && f.status === 'Active').reduce((s, f) => s + f.amount, 0);

      const openAdd = () => {
        setEditingFin(null);
        setFormEntity("");
        setFormType("Loan");
        setFormAmount(1000000);
        setFormRate(11.5);
        setFormPurpose("Working Capital");
        setIsModalOpen(true);
      };

      const openEdit = (f) => {
        setEditingFin(f);
        setFormEntity(f.entity);
        setFormType(f.type);
        setFormAmount(f.amount);
        setFormRate(f.interestRate);
        setFormPurpose(f.purpose);
        setIsModalOpen(true);
      };

      const saveFinancial = (e) => {
        e.preventDefault();
        if (!formEntity.trim()) return alert("Entity name required");

        if (editingFin) {
          setFinancials(prev => prev.map(f => f.id === editingFin.id ? { ...f, entity: formEntity, type: formType, amount: Number(formAmount), interestRate: formType==='Deposit'?0:Number(formRate), purpose: formPurpose } : f));
        } else {
          setFinancials(prev => [{ id: `FIN-${Date.now().toString().slice(-4)}`, entity: formEntity, type: formType, amount: Number(formAmount), interestRate: formType==='Deposit'?0:Number(formRate), status: "Active", purpose: formPurpose }, ...prev]);
        }
        setIsModalOpen(false);

        <div className="space-y-6">

                <span>💳</span> Financial Loans & Security Deposits
              </h2>
              <p className="text-xs sm:text-sm text-slate-400">Bank borrowing facilities, interest rates, and customer collateral deposits</p>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => exportToCSV(financials, 'mill_financials')} className="px-3 py-1.5 bg-slate-800 text-slate-300 text-xs font-semibold rounded-xl border border-slate-700">Export CSV</button>
              <button onClick={openAdd} className="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-amber-500/20">+ Add Instrument</button>
            </div>
          </div>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
            <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl">
              <span className="text-slate-400 uppercase font-semibold">Total Bank Borrowing</span>
              <div className="text-2xl font-bold font-mono text-purple-400 mt-1">{formatPKR(totalLoans)}</div>

                <form onSubmit={saveFinancial} className="space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 block mb-1">Entity / Bank</label>
                    <input type="text" value={formEntity} onChange={e=>setFormEntity(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white" required />
                  </div>
                  <div className="grid grid-cols-2 gap-2">
                    <div>
                      <label className="text-slate-400 block mb-1">Type</label>
                      <select value={formType} onChange={e=>setFormType(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white">
                        <option value="Loan">Bank Loan</option>
                        <option value="Deposit">Deposit</option>
                      </select>
                    </div>
                    <div>
                      <label className="text-slate-400 block mb-1">Amount (PKR)</label>
                      <input type="number" step="50000" value={formAmount} onChange={e=>setFormAmount(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white font-mono" required />
                    </div>
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Interest Rate %</label>
                    <input disabled={formType==='Deposit'} type="number" step="0.1" value={formType==='Deposit'?0:formRate} onChange={e=>setFormRate(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white font-mono" />
                  </div>
                  <div>
                    <label className="text-slate-400 block mb-1">Purpose</label>
                    <input type="text" value={formPurpose} onChange={e=>setFormPurpose(e.target.value)} className="w-full p-2 bg-slate-950 border border-slate-800 rounded-lg text-white" required />
                  </div>
                  <div className="flex justify-end gap-2 pt-2 border-t border-slate-800">
                    <button type="button" onClick={() => setIsModalOpen(false)} className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded-lg">Cancel</button>
                    <button type="submit" className="px-4 py-1.5 bg-amber-500 text-slate-950 font-bold rounded-lg">{editingFin ? 'Update' : 'Save'}</button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 6. MILLING & BLEND LAB VIEW
    // ==========================================
    function BlendLabView({ materials, onConsultAi }) {
      const [hardRatio, setHardRatio] = useState(65);
      const softRatio = 100 - hardRatio;
      const [batchTons, setBatchTons] = useState(50);
      const [targetMoisture, setTargetMoisture] = useState(16.0);

      const hardWheat = materials.find(m => m.item.toLowerCase().includes('hard')) || materials[0] || { moisturePercent: 12.5, glutenPercent: 28.0 };
      const softWheat = materials.find(m => m.item.toLowerCase().includes('soft')) || materials[1] || { moisturePercent: 14.1, glutenPercent: 24.5 };

      const blendedMoisture = ((hardRatio * hardWheat.moisturePercent) + (softRatio * softWheat.moisturePercent)) / 100;
      const blendedGluten = ((hardRatio * hardWheat.glutenPercent) + (softRatio * softWheat.glutenPercent)) / 100;

      // Water required formula
      const waterPerTon = Math.max(0, (1000 * (targetMoisture - blendedMoisture)) / (100 - targetMoisture));
      const totalWaterLiters = Math.round(waterPerTon * batchTons);

      return (
        <div className="space-y-6">
          <div className="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 pb-3 border-b border-slate-800">
            <div>
              <h2 className="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
                <span>🔬</span> Milling Grise & Blend Simulator
              </h2>
              <p className="text-xs sm:text-sm text-slate-400">Calculate grain blending ratios, tempering water additions, and estimated yields</p>
            </div>
            <button
              onClick={() => onConsultAi(`Advise on milling a ${batchTons}T batch with ${hardRatio}% Hard Wheat (${hardWheat.moisturePercent}% M, ${hardWheat.glutenPercent}% G) and ${softRatio}% Soft Wheat (${softWheat.moisturePercent}% M, ${softWheat.glutenPercent}% G). Initial moisture is ${blendedMoisture.toFixed(1)}%, target conditioned moisture is ${targetMoisture}%. What are the best break roll settings and rest times?`)}
              className="px-3.5 py-1.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-amber-500/20"
            >
              Ask AI to Optimize Blend
            </button>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-6">
              <div className="space-y-4 bg-slate-950 p-4 rounded-xl border border-slate-800">
                <div className="flex justify-between text-sm font-bold">
                  <span className="text-amber-400">Hard Wheat: {hardRatio}% ({((batchTons * hardRatio)/100).toFixed(1)}T)</span>
                  <span className="text-blue-400">Soft Wheat: {softRatio}% ({((batchTons * softRatio)/100).toFixed(1)}T)</span>
                </div>
                <input
                  type="range"
                  min="0"
                  max="100"
                  value={hardRatio}
                  onChange={e => setHardRatio(Number(e.target.value))}
                  className="w-full h-2 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-amber-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-4 text-xs">
                <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                  <label className="text-slate-400 block mb-1">Batch Run Size (Tons)</label>
                  <input type="number" min="5" max="300" value={batchTons} onChange={e=>setBatchTons(Number(e.target.value))} className="w-full p-2 bg-slate-900 border border-slate-800 rounded-lg text-white font-mono text-sm" />
                </div>
                <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                  <label className="text-slate-400 block mb-1">Target Conditioning Moisture %</label>
                  <input type="number" step="0.1" value={targetMoisture} onChange={e=>setTargetMoisture(Number(e.target.value))} className="w-full p-2 bg-slate-900 border border-slate-800 rounded-lg text-white font-mono text-sm" />
                </div>
              </div>

              <div className="space-y-2">
                <span className="text-xs font-semibold text-slate-400">Commercial Presets:</span>
                <div className="flex flex-wrap gap-2 text-xs">
                  <button onClick={() => { setHardRatio(80); setTargetMoisture(16.2); }} className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700">🥖 Bakery Bread (80% Hard)</button>
                  <button onClick={() => { setHardRatio(60); setTargetMoisture(15.8); }} className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700">🫓 Commercial Atta (60% Hard)</button>
                  <button onClick={() => { setHardRatio(30); setTargetMoisture(15.0); }} className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-lg border border-slate-700">🍪 Biscuit Soft Flour (30% Hard)</button>
                </div>
              </div>
            </div>

            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
              <h3 className="font-bold text-white text-sm">Simulated Milling Results</h3>
              <div className="p-4 bg-slate-950 rounded-xl border border-slate-800">
                <span className="text-xs text-slate-400 uppercase font-semibold">Resulting Wet Gluten</span>
                <div className="text-3xl font-extrabold text-emerald-400 font-mono mt-1">{blendedGluten.toFixed(1)}%</div>
                <p className="text-[11px] text-slate-400 mt-1">{blendedGluten >= 27.5 ? 'Strong Bread Flour Grade' : 'Standard / Soft Pastry Grade'}</p>
              </div>

              <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 space-y-1">
                <span className="text-xs text-slate-400 uppercase font-semibold">Conditioning Water Needed</span>
                <div className="text-2xl font-bold text-blue-400 font-mono">{totalWaterLiters.toLocaleString()} Liters</div>
                <p className="text-[11px] text-slate-400">~{waterPerTon.toFixed(1)} L/Ton injected at dampener</p>
              </div>

              <div className="p-4 bg-slate-950 rounded-xl border border-slate-800 text-xs font-mono space-y-1">
                <span className="text-slate-400 block font-sans">Predicted Yields ({batchTons}T):</span>
                <div className="flex justify-between"><span>Patent Flour (74%):</span><strong className="text-white">{(batchTons*0.74).toFixed(1)}T</strong></div>
                <div className="flex justify-between"><span>Wheat Bran (22%):</span><strong className="text-emerald-400">{(batchTons*0.22).toFixed(1)}T</strong></div>
                <div className="flex justify-between"><span>Semolina (4%):</span><strong className="text-amber-400">{(batchTons*0.04).toFixed(1)}T</strong></div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 7. AI STUDIO ANALYTICS VIEW
    // ==========================================
    function AiAnalyticsView({ materials, clients, financials, employees, initialPrompt }) {
      const [query, setQuery] = useState(initialPrompt);
      const [loading, setLoading] = useState(false);
      const [response, setResponse] = useState(null);

      const runAnalysis = async (promptToRun) => {
        const text = promptToRun || query;
        if (!text.trim()) return;

        setLoading(true);
        setResponse(null);

        // Try server endpoint /api/analyze first; if running purely standalone, provide high-level offline advisory
        try {
          const res = await fetch("/api/analyze", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ prompt: text, materials, clients, financials, employees })
          });
          if (res.ok) {
            const data = await res.json();
            if (data.text) {
              setResponse(data.text);
              setLoading(false);
              return;
            }
          }
        } catch (e) {
          // offline/standalone fallback logic
        }

        // High fidelity domain simulation fallback when backend is unreachable in pure single-file offline mode
        setTimeout(() => {
          const totalStock = materials.reduce((s, m) => s + m.stockTons, 0);
          const totalReceivables = clients.reduce((s, c) => s + c.outstandingBalance, 0);
          const totalDebt = financials.filter(f => f.type === 'Loan').reduce((s, f) => s + f.amount, 0);

          setResponse(`### 🏢 AI Executive Flour Mill Operations & Financial Advisory
> Generated based on live factory state: **${totalStock} Tons** stored grain, **${formatPKR(totalReceivables)}** accounts receivable, and **${formatPKR(totalDebt)}** bank leverage.

---

### 1. Raw Material Quality & Grain Conditioning Audit
* ⚠️ **High Moisture Alert (Batch B02 - Soft Wheat at 14.1%):** Exceeds the safe storage equilibrium threshold of 13.5%. Soft wheat stored at this humidity level is vulnerable to mold heating and alpha-amylase enzyme degradation.
* 💡 **Tempering & Blend Recommendation:** Do not temper Batch B02 with standard 24h soaking. Blend 65% Hard Wheat (Batch B01 at 12.5% moisture, 28% gluten) with 35% Batch B02. Resulting initial moisture is **13.06%**, requiring ~30 liters/ton water injection to hit the 16.0% first-break roll target.
* ✅ **Finished Flour Extraction:** Maintain straight-grade extraction at 74% to preserve ash under 0.52% for Supreme Bakery specifications.

---

### 2. Commercial Credit & Financial Default Exposure
* ⚠️ **Receivables Concentration Risk:** Total outstanding balance is **${formatPKR(totalReceivables)}**.
* **Critical Client Attention:** **Al-Madina Confectioners** has utilized over **90%** of their credit line (PKR 710,000 / 750,000). Halt further dispatches until a minimum of PKR 300,000 is settled.
* **Collateral Margin:** Security deposits held total **${formatPKR(financials.filter(f=>f.type==='Deposit').reduce((s,f)=>s+f.amount, 0))}**, providing partial recovery coverage.

---

### 3. Immediate Action Matrix
1. **Immediate (Next 12 Hours):** Engage aeration blowers on Silo B to prevent biological hot-spot formation.
2. **Operational (Next 48 Hours):** Post customer receipt vouchers and enforce stop-supply on accounts exceeding 85% credit capacity.
3. **Strategic:** Direct cash collections to prepay high-interest facility at 12.2% APR.`);
          setLoading(false);
        }, 1200);
      };

      return (
        <div className="space-y-6">
          <div className="pb-3 border-b border-slate-800">
            <h2 className="text-xl sm:text-2xl font-bold text-white flex items-center gap-2">
              <span>🤖</span> AI Studio Operational & Financial Advisory
            </h2>
            <p className="text-xs sm:text-sm text-slate-400">Powered by Gemini 3.8 Flash with full factory context injection</p>
          </div>

          {/* Quick presets */}
          <div className="space-y-2">
            <span className="text-xs font-semibold text-slate-400">Recommended Executive Inquiries:</span>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
              {[
                "Analyze my raw material quality and financial risk based on the current records.",
                "Batch B02 has high moisture (14.1%). How should we blend and condition it with Hard Wheat?",
                "Which clients represent default risks, and what collection policies should we enforce?",
                "Evaluate bank debt servicing vs client cash collections for this month."
              ].map((p, idx) => (
                <button
                  key={idx}
                  onClick={() => { setQuery(p); runAnalysis(p); }}
                  className="p-3 bg-slate-900 border border-slate-800 hover:border-amber-500/40 rounded-xl text-left text-slate-300 hover:text-white transition"
                >
                  <p className="font-semibold text-amber-300 mb-0.5">Preset #{idx+1}</p>
                  <p className="text-[11px] text-slate-400 line-clamp-1">{p}</p>
                </button>
              ))}
            </div>
          </div>

          {/* Query input */}
          <div className="p-4 bg-slate-900 border border-slate-800 rounded-2xl space-y-3">
            <label className="text-xs font-semibold text-slate-300 block">Ask Google AI Studio about your Flour Mill data:</label>
            <textarea
              rows="3"
              value={query}
              onChange={e => setQuery(e.target.value)}
              className="w-full p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs sm:text-sm text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
            />
            <div className="flex justify-end">
              <button
                disabled={loading}
                onClick={() => runAnalysis()}
                className="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 disabled:opacity-50 text-slate-950 font-bold text-xs rounded-xl shadow-lg shadow-amber-500/20"
              >
                {loading ? 'Evaluating Factory Telemetry...' : 'Generate AI Insights'}
              </button>
            </div>
          </div>

          {/* Response Box */}
          {response && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
              <div className="p-4 bg-slate-950/80 border-b border-slate-800 flex justify-between items-center text-xs">
                <span className="font-bold text-white flex items-center gap-1.5">
                  <span>✨</span> AI Analysis & Advisory Recommendations
                </span>
                <button onClick={() => navigator.clipboard.writeText(response)} className="px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg">Copy</button>
              </div>
              <div className="p-6 text-xs sm:text-sm text-slate-200 whitespace-pre-line leading-relaxed font-sans">
                {response}
              </div>
            </div>
          )}
        </div>
      );
    }

    // Mount React Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
